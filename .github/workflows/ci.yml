name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-frontend:
    name: Test Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:frontend

  test-backend:
    name: Test Backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:backend

  test-rl:
    name: Test RL Service (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          cd apps/rl-app
          pip install -r requirements.txt
          pytest

  build-docker:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, test-rl]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Compose Stack
        run: docker compose build
